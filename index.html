<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أحمد بن بريك | مصمم ومصور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101815;
    --teal:#0E4B4A;
    --teal-deep:#092E2D;
    --gold:#C9A24B;
    --gold-soft:#E4CD8E;
    --wine:#8C2F39;
    --sand:#F3EBD8;
    --sand-deep:#E7DABF;
    --white:#FBF8F1;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    overflow-x:hidden;
  }

  h1,h2,h3, .display{
    font-family:'Lalezar', sans-serif;
    font-weight:400;
    letter-spacing:.5px;
  }

  a{ color:inherit; text-decoration:none; }

  ::selection{ background:var(--gold); color:var(--ink); }

  /* ---------- Zellige pattern background ---------- */
  .zellige-bg{
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 50% 50%, transparent 0 18px, rgba(201,162,75,.10) 19px 20px, transparent 21px),
      radial-gradient(circle at 0% 0%, transparent 0 18px, rgba(201,162,75,.10) 19px 20px, transparent 21px),
      radial-gradient(circle at 100% 0%, transparent 0 18px, rgba(201,162,75,.10) 19px 20px, transparent 21px),
      radial-gradient(circle at 0% 100%, transparent 0 18px, rgba(201,162,75,.10) 19px 20px, transparent 21px),
      radial-gradient(circle at 100% 100%, transparent 0 18px, rgba(201,162,75,.10) 19px 20px, transparent 21px);
    background-size:80px 80px;
    opacity:.5;
    pointer-events:none;
  }

  /* ---------- Header / Nav ---------- */
  header{
    position:fixed; top:0; right:0; left:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 6vw;
    background:linear-gradient(to bottom, rgba(9,46,45,.92), rgba(9,46,45,0));
    transition:background .3s ease;
  }
  header .brand{
    font-family:'Lalezar', sans-serif;
    color:var(--gold-soft);
    font-size:1.5rem;
  }
  header nav{ display:flex; gap:28px; }
  header nav a{
    color:var(--white);
    font-size:.95rem;
    opacity:.85;
    position:relative;
    padding-bottom:4px;
  }
  header nav a::after{
    content:''; position:absolute; right:0; bottom:0; height:2px; width:0;
    background:var(--gold); transition:width .25s ease;
  }
  header nav a:hover::after{ width:100%; }
  header nav a:hover{ opacity:1; }

  @media (max-width:640px){
    header nav{ gap:16px; }
    header nav a{ font-size:.8rem; }
    header .brand{ font-size:1.2rem; }
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(140,47,57,.35), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(201,162,75,.18), transparent 55%),
      linear-gradient(160deg, var(--teal-deep), var(--teal) 60%, var(--teal-deep));
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:120px 6vw 80px;
  }

  .hero-inner{
    position:relative; z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6vw;
    flex-wrap:wrap;
    max-width:1200px;
  }

  .hero-text{
    text-align:right;
    max-width:520px;
    animation:fadeUp 1s ease .2s both;
  }
  .hero-text .eyebrow{
    display:inline-block;
    color:var(--gold-soft);
    font-size:.85rem;
    letter-spacing:3px;
    border:1px solid rgba(228,205,142,.4);
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:22px;
  }
  .hero-text h1{
    font-size:clamp(2.6rem, 6vw, 4.4rem);
    color:var(--white);
    line-height:1.15;
    margin-bottom:18px;
  }
  .hero-text h1 span{ color:var(--gold); }
  .hero-text p{
    color:rgba(251,248,241,.78);
    font-size:1.15rem;
    line-height:1.9;
    margin-bottom:34px;
  }
  .hero-cta{ display:flex; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
  .btn{
    display:inline-block;
    padding:14px 32px;
    border-radius:999px;
    font-weight:700;
    font-size:1rem;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .btn-primary{
    background:var(--gold);
    color:var(--teal-deep);
    box-shadow:0 10px 30px rgba(201,162,75,.35);
  }
  .btn-primary:hover{ transform:translateY(-3px); box-shadow:0 14px 36px rgba(201,162,75,.5); }
  .btn-ghost{
    border:1px solid rgba(251,248,241,.5);
    color:var(--white);
  }
  .btn-ghost:hover{ background:rgba(251,248,241,.08); transform:translateY(-3px); }

  /* ---------- Signature rosette portrait frame ---------- */
  .rosette-wrap{
    position:relative;
    width:min(340px, 62vw);
    aspect-ratio:1/1;
    animation:fadeUp 1s ease .4s both, floaty 7s ease-in-out infinite;
  }
  .rosette-wrap svg{
    position:absolute; inset:0;
    width:100%; height:100%;
    animation:spin 60s linear infinite;
  }
  .rosette-wrap .portrait{
    position:absolute;
    inset:11%;
    border-radius:50%;
    overflow:hidden;
    border:3px solid var(--gold-soft);
    box-shadow:0 0 0 10px rgba(9,46,45,.4), 0 20px 60px rgba(0,0,0,.45);
  }
  .rosette-wrap .portrait img{
    width:100%; height:100%; object-fit:cover;
    filter:saturate(1.05) contrast(1.03);
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-14px);} }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(24px);} to{ opacity:1; transform:translateY(0);} }

  .scroll-cue{
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    color:var(--gold-soft); font-size:.8rem; letter-spacing:2px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    opacity:.8; z-index:2;
  }
  .scroll-cue .line{
    width:1px; height:36px;
    background:linear-gradient(to bottom, var(--gold-soft), transparent);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  /* ---------- Section shells ---------- */
  section{ position:relative; padding:110px 6vw; }
  .section-head{ text-align:center; max-width:640px; margin:0 auto 60px; }
  .section-head .eyebrow{
    color:var(--wine); font-weight:700; letter-spacing:3px; font-size:.85rem;
    display:block; margin-bottom:14px;
  }
  .section-head h2{ font-size:clamp(2rem, 4vw, 3rem); margin-bottom:16px; color:var(--teal-deep); }
  .section-head p{ color:#5b6b63; font-size:1.05rem; line-height:1.9; }

  .reveal{ opacity:0; transform:translateY(30px); transition:opacity .8s ease, transform .8s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  /* ---------- About ---------- */
  .about{ background:var(--white); }
  .about-grid{
    display:grid; grid-template-columns:1fr 1.2fr; gap:64px;
    max-width:1100px; margin:0 auto; align-items:center;
  }
  .about-photo{ position:relative; }
  .about-photo .frame{
    border-radius:24px; overflow:hidden;
    box-shadow:0 30px 60px rgba(16,24,21,.18);
    border:4px solid var(--sand-deep);
    transform:rotate(-2deg);
    transition:transform .4s ease;
  }
  .about-photo .frame:hover{ transform:rotate(0deg) scale(1.02); }
  .about-photo img{ width:100%; display:block; aspect-ratio:4/5; object-fit:cover; }
  .about-photo .tag{
    position:absolute; bottom:-22px; right:-22px;
    background:var(--wine); color:var(--white);
    padding:14px 22px; border-radius:16px;
    font-family:'Lalezar', sans-serif; font-size:1.1rem;
    box-shadow:0 12px 30px rgba(140,47,57,.35);
    transform:rotate(3deg);
  }
  .about-copy h3{ font-size:1.9rem; color:var(--teal-deep); margin-bottom:20px; }
  .about-copy p{ color:#4a5850; line-height:2; font-size:1.05rem; margin-bottom:18px; }
  .about-stats{ display:flex; gap:36px; margin-top:32px; flex-wrap:wrap; }
  .about-stats div{ text-align:center; }
  .about-stats strong{ display:block; font-family:'Lalezar'; font-size:2rem; color:var(--wine); }
  .about-stats span{ font-size:.85rem; color:#7a8880; }

  @media (max-width:820px){
    .about-grid{ grid-template-columns:1fr; }
    .about-photo{ max-width:320px; margin:0 auto 20px; }
  }

  /* ---------- Services ---------- */
  .services{ background:var(--sand-deep); }
  .services .zellige-bg{ opacity:.35; }
  .cards{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:30px;
    max-width:1100px; margin:0 auto; position:relative; z-index:1;
  }
  .card{
    background:var(--white);
    border-radius:20px;
    padding:40px 30px;
    text-align:center;
    box-shadow:0 16px 40px rgba(16,24,21,.08);
    transition:transform .3s ease, box-shadow .3s ease;
    border-top:4px solid var(--gold);
  }
  .card:hover{ transform:translateY(-10px); box-shadow:0 24px 50px rgba(16,24,21,.16); }
  .card .icon{
    width:64px; height:64px; margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center;
    background:var(--teal-deep); border-radius:50%;
  }
  .card .icon svg{ width:30px; height:30px; stroke:var(--gold-soft); fill:none; stroke-width:1.6; }
  .card h3{ font-size:1.3rem; color:var(--teal-deep); margin-bottom:12px; }
  .card p{ color:#6b7a72; font-size:.95rem; line-height:1.8; }

  @media (max-width:820px){ .cards{ grid-template-columns:1fr; } }

  /* ---------- Gallery ---------- */
  .gallery{ background:var(--white); }
  .gallery-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:26px;
    max-width:1000px; margin:0 auto;
  }
  .gallery-grid figure{
    position:relative; border-radius:22px; overflow:hidden;
    box-shadow:0 20px 50px rgba(16,24,21,.15);
  }
  .gallery-grid img{
    width:100%; height:100%; object-fit:cover; display:block;
    aspect-ratio:3/4;
    transition:transform .6s ease;
  }
  .gallery-grid figure:hover img{ transform:scale(1.06); }
  .gallery-grid figcaption{
    position:absolute; inset-inline:0; bottom:0;
    padding:26px 22px;
    background:linear-gradient(to top, rgba(9,46,45,.85), transparent);
    color:var(--white);
    font-family:'Lalezar';
    font-size:1.15rem;
  }
  @media (max-width:640px){ .gallery-grid{ grid-template-columns:1fr; } }

  /* ---------- Contact ---------- */
  .contact{
    background:linear-gradient(160deg, var(--teal-deep), var(--teal) 60%, var(--teal-deep));
    text-align:center;
    overflow:hidden;
  }
  .contact .section-head h2{ color:var(--white); }
  .contact .section-head p{ color:rgba(251,248,241,.75); }
  .contact .section-head .eyebrow{ color:var(--gold-soft); }
  .contact-links{
    display:flex; gap:20px; justify-content:center; flex-wrap:wrap; position:relative; z-index:1;
  }
  .contact-links a{
    display:flex; align-items:center; gap:10px;
    background:rgba(251,248,241,.08);
    border:1px solid rgba(228,205,142,.3);
    color:var(--white);
    padding:14px 26px;
    border-radius:999px;
    font-size:.95rem;
    transition:all .25s ease;
  }
  .contact-links a:hover{
    background:var(--gold); color:var(--teal-deep); transform:translateY(-3px);
    border-color:var(--gold);
  }
  .contact-links svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; }

  /* --- Download section --- */
  .download-section {
    margin-top: 50px;
    padding: 30px 20px;
    background: rgba(251,248,241,.06);
    border-radius: 30px;
    border: 1px solid rgba(228,205,142,.2);
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }
  .download-section p {
    color: var(--gold-soft);
    font-size: 1.1rem;
    margin-bottom: 20px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .download-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .download-buttons .btn {
    background: var(--white);
    color: var(--teal-deep);
    padding: 12px 28px;
    border-radius: 999px;
    font-weight: 700;
    font-size: .95rem;
    transition: all .25s ease;
    border: none;
    box-shadow: 0 8px 25px rgba(0,0,0,.2);
  }
  .download-buttons .btn:hover {
    transform: translateY(-3px) scale(1.02);
    background: var(--gold);
    color: var(--teal-deep);
    box-shadow: 0 12px 30px rgba(201,162,75,.4);
  }
  .download-buttons .btn-app {
    background: var(--gold);
    color: var(--teal-deep);
  }
  .download-buttons .btn-app:hover {
    background: var(--white);
  }

  footer{
    text-align:center; padding:26px; background:var(--teal-deep);
    color:rgba(251,248,241,.5); font-size:.85rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">أحمد بن بريك</div>
  <nav>
    <a href="#about">نبذة</a>
    <a href="#services">التخصصات</a>
    <a href="#gallery">المعرض</a>
    <a href="#contact">تواصل</a>
  </nav>
</header>
