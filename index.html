<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أعمال أحمد بن بريك</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            border: 1px solid #2d333b;
            border-radius: 28px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* شبكة الدوائر الخمس */
        .circles-layout {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 35px auto;
        }

        .avatar-circle {
            position: absolute;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            overflow: hidden;
            border: 3.5px solid;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            background-color: #21262d;
            transition: transform 0.3s ease;
        }

        .avatar-circle:hover {
            transform: scale(1.08);
            z-index: 10;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* تحديد مواضع وألوان الحدود الخمسة */
        .pos-top-left {
            top: 0;
            left: 20px;
            border-color: #e63946; /* أحمر */
        }

        .pos-top-right {
            top: 0;
            right: 20px;
            border-color: #1d3557; /* أزرق غامق / أزرق فاتح */
        }

        .pos-center {
            top: 75px;
            left: 77.5px;
            width: 85px;
            height: 85px;
            border-color: #ffb703; /* أصفر */
            z-index: 3;
        }

        .pos-bottom-left {
            bottom: 0;
            left: 20px;
            border-color: #2a9d8f; /* أخضر */
        }

        .pos-bottom-right {
            bottom: 0;
            right: 20px;
            border-color: #f4a261; /* برتقالي */
        }

        /* كارت التعليمات */
        .description-box {
            background-color: #1c2128;
            border: 1px solid #30363d;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 22px;
            font-size: 15px;
            line-height: 1.6;
            color: #adbac7;
        }

        /* الأزرار */
        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(90deg, #ff8800, #ff5500);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(255, 85, 0, 0.35);
            margin-bottom: 14px;
            transition: opacity 0.2s;
        }

        .btn-download:hover {
            opacity: 0.92;
        }

        .btn-link {
            display: block;
            width: 100%;
            color: #768390;
            font-size: 14px;
            text-decoration: none;
            padding: 8px;
        }

        .btn-link:hover {
            color: #adbac7;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1 class="title">أعمال أحمد بن بريك</h1>

        <!-- شبكة الصور الدائرية -->
        <div class="circles-layout">
            <!-- أعلى يسار -->
            <div class="avatar-circle pos-top-left">
                <img src="img1.jpg" alt="أحمد بن بريك">
            </div>

            <!-- أعلى يمين -->
            <div class="avatar-circle pos-top-right">
                <img src="img2.jpg" alt="أحمد بن بريك">
            </div>

            <!-- الوسط -->
            <div class="avatar-circle pos-center">
                <img src="img1.jpg" alt="أحمد بن بريك">
            </div>

            <!-- أسفل يسار -->
            <div class="avatar-circle pos-bottom-left">
                <img src="img2.jpg" alt="أحمد بن بريك">
            </div>

            <!-- أسفل يمين -->
            <div class="avatar-circle pos-bottom-right">
                <img src="img1.jpg" alt="أحمد بن بريك">
            </div>
        </div>

        <!-- صندوق الوصف -->
        <div class="description-box">
            لتري المزيد من أعمال أحمد بن بريك<br>
            <strong>حمل المتصفح المناسب</strong>
        </div>

        <!-- الأزرار -->
        <a href="#" class="btn-download">
            🚀 تحميل المتصفح المناسب
        </a>

        <a href="#" class="btn-link">
            رابط التحميل المباشر
        </a>
    </div>

</body>
</html>
