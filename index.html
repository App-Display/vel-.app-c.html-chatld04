<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحمد بن بريك - المعرض الشخصي</title>
    <style>
        /* إعادة ضبط الأساسيات واستيراد خط عربي جميل */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        /* خلفية مبهجة بدمج ألوان زاهية (Gradient) */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 40%, #a1c4fd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* حاوية المحتوى الرئيسية */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 4px solid #ffffff;
        }

        /* عنوان الصفحة */
        h1 {
            color: #FF3366;
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.05);
        }

        /* تأثير الملصق (Sticker) للصورة */
        .sticker-wrapper {
            margin: 20px auto 30px;
            display: inline-block;
            /* هزة خفيفة لإعطاء طابع حركي زاهي */
            transform: rotate(-3deg);
            transition: transform 0.3s ease;
        }

        .sticker-wrapper:hover {
            transform: rotate(0deg) scale(1.03);
        }

        .sticker-img {
            max-width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: cover;
            border-radius: 20px;
            
            /* إطار وحواف بيضاء سميكة لإعطاء شكل الملصق */
            border: 8px solid #FFFFFF;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18), 
                        0 0 0 3px #FFD166; /* إطار ملون خارجي محيط بالملصق */
        }

        /* النص أسفل الصورة */
        .info-text {
            color: #2B2D42;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* زر الرابط بتصميم متوهج وزاهي */
        .download-btn {
            display: inline-block;
            background: linear-gradient(45deg, #FF512F, #DD2476);
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(221, 36, 118, 0.4);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(221, 36, 118, 0.6);
            background: linear-gradient(45deg, #DD2476, #FF512F);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- اسم صاحب الصفحة -->
        <h1>أحمد بن بريك</h1>

        <!-- منطقة صورة الملصق -->
        <div class="sticker-wrapper">
            <!-- ضع رابط صورتك مكان src في السطر التالي -->
            <img src="https://via.placeholder.com/350x350/FFD166/333333?text=ضع+صورتك+هنا" alt="عمل أحمد بن بريك" class="sticker-img">
        </div>

        <!-- النص المطلوب -->
        <p class="info-text">
            لترى المزيد من أعمال أحمد بن بريك حمل المتصفح المناسب
        </p>

        <!-- رابط التحميل -->
        <!-- استبدل # بالرابط الذي تريده -->
        <a href="https://example.com" target="_blank" class="download-btn">
            تحميل المتصفح الآن 🚀
        </a>
    </div>

</body>
</html>
