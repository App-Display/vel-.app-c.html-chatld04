<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشيخ أحمد بن بريك</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Traditional Arabic', 'Amiri', 'Segoe UI', Tahoma, sans-serif;
        background: linear-gradient(135deg, #1a2a3a 0%, #0d1b26 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        background: #ffffff;
        border-radius: 20px;
        max-width: 420px;
        width: 100%;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        text-align: center;
    }
    .photo-wrap {
        background: linear-gradient(135deg, #2c3e50, #1a2530);
        padding: 25px 25px 0 25px;
    }
    .photo-wrap img {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 50%;
        border: 5px solid #d4af37;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .content {
        padding: 25px 30px 35px 30px;
    }
    h1 {
        color: #1a2a3a;
        font-size: 28px;
        margin-bottom: 8px;
        font-weight: 700;
    }
    .title-badge {
        display: inline-block;
        background: #d4af37;
        color: #1a2a3a;
        padding: 5px 18px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 20px;
    }
    p.description {
        color: #444;
        font-size: 17px;
        line-height: 1.9;
        margin-top: 10px;
        border-top: 2px solid #f0f0f0;
        padding-top: 20px;
    }
    .decor {
        margin: 20px auto 0 auto;
        width: 60px;
        height: 3px;
        background: #d4af37;
        border-radius: 3px;
    }
</style>
</head>
