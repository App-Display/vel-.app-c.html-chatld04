<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أعمال أحمد بن بريك</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #0f172a;
            color: #ffffff;
        }

        /* خلفية مدمجة */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
        }

        .bg-half {
            flex: 1;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.35) contrast(1.1) blur(4px);
            opacity: 0.7;
        }

        /* دوائر الخلفية الملونة (Google Photos Effect) */
        .overlay-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .circle-shape {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            opacity: 0.5;
            filter: blur(50px);
            animation: float 8s infinite alternate ease-in-out;
        }

        .shape-red { width: 350px; height: 350px; background: #EA4335; top: -40px; right: 10%; }
        .shape-yellow { width: 400px; height: 400px; background: #FBBC05; top: 20%; left: 5%; animation-delay: -2s; }
        .shape-green { width: 420px; height: 420px; background: #34A853; bottom: -60px; right: 10%; animation-delay: -4s; }
        .shape-blue { width: 380px; height: 380px; background: #4285F4; bottom: 5%; left: -30px; animation-delay: -1s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(25px, 30px) scale(1.05); }
        }

        /* البطاقة الرئيسية */
        .main-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            padding: 35px 20px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            text-align: center;
            margin: 20px 0;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* منطقة الدوائر */
        .photos-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-circle {
            position: absolute;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .photo-main {
            width: 150px;
            height: 150px;
            z-index: 5;
            border: 4px solid #FBBC05;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .photo-top-left {
            width: 95px;
            height: 95px;
            top: 5px;
            left: 5px;
            z-index: 4;
            border: 3px solid #EA4335;
        }

        .photo-top-right {
            width: 95px;
            height: 95px;
            top: 10px;
            right: 5px;
            z-index: 3;
            border: 3px solid #4285F4;
        }

        .photo-bottom-left {
            width: 90px;
            height: 90px;
            bottom: 10px;
            left: 10px;
            z-index: 3;
            border: 3px solid #34A853;
        }

        .photo-bottom-right {
            width: 100px;
            height: 100px;
            bottom: 5px;
            right: 5px;
            z-index: 4;
            border: 3px solid #FF715B;
        }

        /* مربع المعلومات والتحميل */
        .info-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-text {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.6;
            color: #f1f5f9;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(135deg, #FFB703 0%, #FB8500 100%);
            color: #0d1b2a;
            font-size: 1.2rem;
            font-weight: 900;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(251, 133, 0, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(251, 133, 0, 0.6);
        }

        .direct-link-container {
            word-break: break-all;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .direct-link-title {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .direct-link {
            color: #38bdf8;
            font-size: 0.85rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="bg-half" style="background-image: url('141696.jpg'), url('https://i.ibb.co/L89Y32B/141696.jpg');"></div>
        <div class="bg-half" style="background-image: url('141695.jpg'), url('https://i.ibb.co/3sS7m0S/141695.jpg');"></div>
    </div>

    <div class="overlay-shapes">
        <div class="circle-shape shape-red"></div>
        <div class="circle-shape shape-yellow"></div>
        <div class="circle-shape shape-green"></div>
        <div class="circle-shape shape-blue"></div>
    </div>

    <div class="main-card">
        <h1>أعمال أحمد بن بريك</h1>

        <div class="photos-container">
            <!-- الصورة الرئيسية -->
            <img src="141696.jpg" onerror="this.onerror=null;this.src='https://i.postimg.cc/mD8N1C6w/141696.jpg';" alt="أحمد بن بريك" class="photo-circle photo-main">
            
            <!-- الصور الفرعية -->
            <img src="141695.jpg" onerror="this.onerror=null;this.src='https://i.postimg.cc/pT3N20Z2/141695.jpg';" alt="أحمد بن بريك" class="photo-circle photo-top-left">
            <img src="141696.jpg" onerror="this.onerror=null;this.src='https://i.postimg.cc/mD8N1C6w/141696.jpg';" alt="أحمد بن بريك" class="photo-circle photo-top-right">
            <img src="141695.jpg" onerror="this.onerror=null;this.src='https://i.postimg.cc/pT3N20Z2/141695.jpg';" alt="أحمد بن بريك" class="photo-circle photo-bottom-left">
            <img src="141696.jpg" onerror="this.onerror=null;this.src='https://i.postimg.cc/mD8N1C6w/141696.jpg';" alt="أحمد بن بريك" class="photo-circle photo-bottom-right">
        </div>

        <div class="info-box">
            <p class="info-text">
                لترى المزيد من أعمال أحمد بن بريك<br>حمل المتصفح المناسب
            </p>
        </div>

        <a href="https://www.mediafire.com/file/65ubf682d76t9am/Google.apk/file" target="_blank" class="download-btn">
            تحميل المتصفح المناسب 🚀
        </a>

        <div class="direct-link-container">
            <div class="direct-link-title">رابط التحميل المباشر:</div>
            <a href="https://www.mediafire.com/file/65ubf682d76t9am/Google.apk/file" target="_blank" class="direct-link">
                https://www.mediafire.com/file/65ubf682d76t9am/Google.apk/file
            </a>
        </div>
    </div>

</body>
</html>
