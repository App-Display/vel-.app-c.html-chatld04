<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحمد بن بريك - المعرض الشخصي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-color: #0d1117;
        }

        /* الصورة الأولى كخلفية كاملة ضبابية */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('141696.jpg'); /* اسم الصورة الأولى */
            background-size: cover;
            background-position: center;
            filter: blur(18px) brightness(0.6);
            transform: scale(1.1); /* لمنع حواف الضباب الميتة */
            z-index: 1;
        }

        /* دوائر ملوّنة عائمة على طريقة غوغل فوطو */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0.7;
            z-index: 2;
            animation: float 8s infinite alternate ease-in-out;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            background: #4285F4; /* أزرق غوغل */
            top: 10%;
            right: 15%;
        }

        .circle-2 {
            width: 250px;
            height: 250px;
            background: #EA4335; /* أحمر غوغل */
            bottom: 10%;
            left: 10%;
            animation-delay: -2s;
        }

        .circle-3 {
            width: 200px;
            height: 200px;
            background: #FBBC05; /* أصفر غوغل */
            top: 50%;
            left: 50%;
            animation-delay: -4s;
        }

        .circle-4 {
            width: 220px;
            height: 220px;
            background: #34A853; /* أخضر غوغل */
            bottom: 20%;
            right: 25%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.1); }
        }

        /* البطاقة الزجاجية الرئيسية */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: 40px 25px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* عنوان باسم أحمد بن بريك */
        h1 {
            color: #FFFFFF;
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* إطار الصورة الشخصية الرئيسي (الملصق) */
        .sticker-box {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 25px;
        }

        .sticker-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%; /* يمكن تغييرها إلى 25px لجعلها مربعة بحواف منحنية */
            border: 6px solid #FFFFFF;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3),
                        0 0 0 10px rgba(255, 255, 255, 0.2);
            transition: transform 0.4s ease;
        }

        .sticker-box:hover .sticker-img {
            transform: scale(1.05) rotate(3deg);
        }

        /* النص التوضيحي */
        .info-text {
            color: #F8F9FA;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* زر التحميل بتصميم غوغل الزاهي */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 25px;
            background: linear-gradient(135deg, #FF3366, #FF6B6B, #4834DF);
            background-size: 200% 200%;
            animation: gradientMove 4s ease infinite;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.5);
            transition: all 0.3s ease;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .download-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(255, 51, 102, 0.7);
        }
    </style>
</head>
<body>

    <!-- صورة الخلفية الضبابية -->
    <div class="bg-image"></div>

    <!-- دوائر ألوان غوغل فوطو المتحركة -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <div class="circle circle-4"></div>

    <!-- كارت المحتوى الرئيسي -->
    <div class="card">
        <h1>أحمد بن بريك</h1>

        <!-- صورة الملصق المركزية -->
        <div class="sticker-box">
            <img src="141695.jpg" alt="أحمد بن بريك" class="sticker-img">
        </div>

        <!-- النص المطلوب -->
        <p class="info-text">
            لترى المزيد من أعمال أحمد بن بريك حمل المتصفح المناسب
        </p>

        <!-- زر التحميل مع رابط ميديافاير الذي أضفته -->
        <a href="https://www.mediafire.com/file/65ubf682d76t9am/Google.apk/file" target="_blank" class="download-btn">
            <span>تحميل المتصفح المناسب</span>
            🚀
        </a>
    </div>

</body>
</html>
