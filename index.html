<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أعمال أحمد بن بريك</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            border: 1px solid #30363d;
            border-radius: 24px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        /* حاوية الدوائر المتقاطعة */
        .circles-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 30px auto;
        }

        .circle-item {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-color: #21262d;
        }

        .circle-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* تحديد مواضع وألوان إطارات الدوائر الـ 5 */
        .c-top-left {
            top: 10px;
            left: 25px;
            border-color: #ea4335; /* أحمر */
        }

        .c-top-right {
            top: 10px;
            right: 25px;
            border-color: #4285f4; /* أزرق */
        }

        .c-center {
            top: 85px;
            left: 85px;
            width: 90px;
            height: 90px;
            border-color: #fbbc05; /* أصفر */
            z-index: 2;
        }

        .c-bottom-left {
            bottom: 10px;
            left: 25px;
            border-color: #34a853; /* أخضر */
        }

        .c-bottom-right {
            bottom: 10px;
            right: 25px;
            border-color: #ff6d00; /* برتقالي */
        }

        /* كارت الوصف */
        .info-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.6;
            color: #c9d1d9;
        }

        /* أزرار التحميل */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(90deg, #ff9100, #ff6d00);
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 109, 0, 0.4);
            margin-bottom: 15px;
        }

        .btn-secondary {
            display: block;
            width: 100%;
            background-color: transparent;
            color: #8b949e;
            font-size: 14px;
            text-decoration: none;
            padding: 8px;
            border-radius: 10px;
            border: 1px dashed #30363d;
        }
    </style>
</head>
